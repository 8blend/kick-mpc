# kick-mpc: compila per Windows l'emulatore KICK (app Kick vera + pannello virtuale "KICK Surface").
# Base: proposta n. 40 del repo ufficiale (emulatore di Thomas Phillips, AGPL-3.0) + le nostre patch in patches/.
# Si avvia da solo a ogni caricamento di file, oppure a mano da Actions -> "Build emulatore KICK" -> Run workflow.
name: Build emulatore KICK

on:
  push:
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/MusicTribeOpenSource/0700-AAM
  UPSTREAM_REF: refs/pull/40/head
  UPSTREAM_SHA: 49bb111e8a20a95f3b8e3f755a715ef7366a98ac

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    name: Emulatore Windows

    steps:
      - name: Niente conversione dei fine riga (serve alla patch di JUCE)
        shell: bash
        run: git config --global core.autocrlf false

      - name: File del nostro repository
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Codice KICK + emulatore (proposta n. 40)
        shell: bash
        run: |
          git init -q upstream
          cd upstream
          git remote add origin "$UPSTREAM_REPO"
          git fetch -q --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          echo "Versione: $(git rev-parse HEAD) (attesa $UPSTREAM_SHA)"

      - name: Applica le patch kick-mpc (cartella patches/)
        shell: bash
        run: |
          cd upstream
          shopt -s nullglob
          for p in ../ours/patches/*.patch; do
            echo "==> $p"
            git apply --whitespace=nowarn "$p"
          done

      - name: Compila Kick e KICK Surface
        shell: pwsh
        run: |
          cd upstream
          .\emu\build.ps1 -Jobs 4 *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build-log.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepara il pacchetto
        shell: pwsh
        run: |
          $up  = "$env:GITHUB_WORKSPACE\upstream"
          $pkg = "$env:GITHUB_WORKSPACE\KICK-Emulatore"
          New-Item -ItemType Directory -Force "$pkg\Kick", "$pkg\Surface", "$pkg\tools" | Out-Null

          $kick    = Get-ChildItem "$up\build\emu" -Recurse -Filter Kick.exe | Select-Object -First 1
          $surface = Get-ChildItem "$up\build\surface" -Recurse -Filter 'KICK Surface.exe' | Select-Object -First 1
          if (-not $kick -or -not $surface) { throw 'eseguibili non trovati' }

          Copy-Item $kick.FullName "$pkg\Kick\"
          Get-ChildItem $kick.DirectoryName -Filter *.dll | Copy-Item -Destination "$pkg\Kick\"
          foreach ($d in 'assets', 'demos', 'templates') {
            if (Test-Path "$up\build\emu\$d") { Copy-Item "$up\build\emu\$d" "$pkg\Kick\$d" -Recurse }
          }
          Copy-Item $surface.FullName "$pkg\Surface\"
          Get-ChildItem $surface.DirectoryName -Filter *.dll | Copy-Item -Destination "$pkg\Surface\"
          Copy-Item "$up\emu\tools\make_samples.py" "$pkg\tools\" -ErrorAction SilentlyContinue

          # Avvio con doppio clic
          Set-Content -Encoding ascii "$pkg\Avvia KICK.bat" -Value @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0tools\avvia.ps1"
          if errorlevel 1 pause
          '@

          Set-Content -Encoding utf8 "$pkg\tools\avvia.ps1" -Value @'
          # Avvia il pannello virtuale KICK Surface e l'app Kick (adattato da emu\run.ps1, AGPL-3.0).
          $ErrorActionPreference = 'Stop'
          $base = Split-Path $PSScriptRoot -Parent
          $Root = Join-Path $env:USERPROFILE 'KickEmu'
          $Port = 50910
          $env:KICK_EMU_ROOT = $Root
          New-Item -ItemType Directory -Force $Root | Out-Null

          if (-not (Test-Path "$Root\data\sounds\Emu Kit")) {
              $py = Get-Command python -ErrorAction SilentlyContinue
              if ($py -and $py.Source -notlike '*WindowsApps*') { & $py.Source "$base\tools\make_samples.py" $Root }
              else { Write-Host 'Python non trovato: niente suoni demo (facoltativo).' }
          }

          Remove-Item "$Root\surface.port" -ErrorAction SilentlyContinue
          $surface = Start-Process -FilePath "$base\Surface\KICK Surface.exe" -ArgumentList @('--root', "`"$Root`"", '--tcp', $Port) -PassThru `
              -RedirectStandardOutput "$Root\surface.log" -RedirectStandardError "$Root\surface.err.log"
          for ($i = 0; $i -lt 100 -and -not (Test-Path "$Root\surface.port"); $i++) {
              if ($surface.HasExited) { Get-Content "$Root\surface.log", "$Root\surface.err.log"; exit 1 }
              Start-Sleep -Milliseconds 100
          }
          $env:KICK_SERIAL_PORT = (Get-Content "$Root\surface.port" -Raw).Trim()

          $kick = Start-Process -FilePath "$base\Kick\Kick.exe" -WorkingDirectory "$base\Kick" -PassThru `
              -RedirectStandardOutput "$Root\kick.log" -RedirectStandardError "$Root\kick.err.log"
          Write-Host "KICK avviata. Log in $Root. Chiudi il pannello per uscire."
          try { while (-not $kick.HasExited -and -not $surface.HasExited) { Start-Sleep -Milliseconds 500 } }
          finally { foreach ($p in @($kick, $surface)) { if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force } } }
          '@
          Get-ChildItem $pkg -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Scarica l'emulatore
        uses: actions/upload-artifact@v4
        with:
          name: KICK-Emulatore-Windows
          path: KICK-Emulatore/

      - name: Log per Claude (se qualcosa va storto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows
          path: |
            build-log.txt
            upstream/build/emu-configure.log
            upstream/build/surface-configure.log
          if-no-files-found: ignore
